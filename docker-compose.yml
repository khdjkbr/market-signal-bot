services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: trading_bot
      POSTGRES_USER: trading
      POSTGRES_PASSWORD: trading
    ports:
      - "5432:5432"
    volumes:
      - trading-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading -d trading_bot"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    environment:
      PORT: 3000
      DATABASE_URL: postgres://trading:trading@db:5432/trading_bot
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  trading-data:
