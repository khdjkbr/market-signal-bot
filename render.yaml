services:
  - type: web
    name: market-signal-bot-api
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile
    startCommand: pnpm run db:migrate && pnpm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: FRONTEND_URL
        value: https://khdjkbr.github.io
      - key: SCHEDULER_ENABLED
        value: "true"
      - key: SCHEDULER_INTERVAL_MS
        value: "900000"
      - key: DATABASE_URL
        fromDatabase:
          name: market-signal-bot-db
          property: connectionString

databases:
  - name: market-signal-bot-db
    plan: free
